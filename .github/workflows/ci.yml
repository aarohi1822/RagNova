name: ci

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # The tests and linter need no ML libraries: retrieval logic, metrics and the
        # report generator are pure Python.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.3 ruff==0.17.4
      - name: Lint
        run: ruff check frontend tests eval
      - name: Test
        run: pytest -q
