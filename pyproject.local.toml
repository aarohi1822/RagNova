[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-qa-platform"
version = "0.1.0"
description = "Production-grade hybrid RAG question answering system for enterprise-style AI portfolios."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "streamlit>=1.38.0",
  "langchain-text-splitters>=0.3.0",
  "sentence-transformers>=3.0.1",
  "chromadb>=0.5.5",
  "rank-bm25>=0.2.2",
  "numpy>=1.26.4",
  "scikit-learn>=1.5.1",
  "pypdf>=5.0.0",
  "docx2txt>=0.8",
  "openai>=1.40.0",
  "httpx>=0.27.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "networkx>=3.3",
  "pandas>=2.2.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.3",
  "mypy>=1.11.1"
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

