name: ci

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # pyproject.toml is kept as pyproject.local.toml so Streamlit Cloud ignores it
          cp pyproject.local.toml pyproject.toml
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check backend frontend tests scripts eval
      - name: Test
        run: pytest -q

